name: Multi-Platform Release Build

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            buildCommand: flutter build apk --release
            artifactName: app-release.apk
            artifactPath: build/app/outputs/flutter-apk/app-release.apk

          - os: macos-latest
            platform: ios
            # Use no-codesign to bypass apple developer cert requirements on CI
            buildCommand: flutter build ios --release --no-codesign && mkdir -p build/ios/Payload && cp -R build/ios/iphoneos/Runner.app build/ios/Payload/ && cd build/ios && zip -ry NodeRadio-iOS.zip Payload/
            artifactName: NodeRadio-iOS.zip
            artifactPath: build/ios/NodeRadio-iOS.zip

          - os: macos-latest
            platform: macos
            buildCommand: flutter build macos --release && cd build/macos/Build/Products/Release && zip -ry NodeRadio-macOS.zip noderadio.app
            artifactName: NodeRadio-macOS.zip
            artifactPath: build/macos/Build/Products/Release/NodeRadio-macOS.zip

          - os: windows-latest
            platform: windows
            buildCommand: flutter build windows --release && cd build\windows\x64\runner\Release && Compress-Archive -Path * -DestinationPath NodeRadio-Windows.zip
            artifactName: NodeRadio-Windows.zip
            artifactPath: build/windows/x64/runner/Release/NodeRadio-Windows.zip

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure CMake and Ninja (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install ninja cmake -y

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Artifacts
        run: ${{ matrix.buildCommand }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifactPath }}
