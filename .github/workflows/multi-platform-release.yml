name: Multi-Platform Release Build

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            buildCommand: flutter build apk --release
            
          - os: macos-latest
            platform: ios
            # Use no-codesign to bypass apple developer cert requirements on CI
            buildCommand: flutter build ios --release --no-codesign

          - os: macos-latest
            platform: macos
            buildCommand: flutter build macos --release

          - os: windows-latest
            platform: windows
            buildCommand: flutter build windows --release

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure CMake and Ninja (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install ninja cmake -y

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Artifacts
        run: ${{ matrix.buildCommand }}

      - name: Package Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk NodeRadio-Android-${{ github.ref_name }}.apk

      - name: Package iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -ry ../../NodeRadio-iOS-${{ github.ref_name }}.zip Payload/

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          zip -ry ../../../../../NodeRadio-macOS-${{ github.ref_name }}.zip noderadio.app

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          zip -r ../../../../../NodeRadio-Windows-${{ github.ref_name }}.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NodeRadio-Android-*.apk
            NodeRadio-iOS-*.zip
            NodeRadio-macOS-*.zip
            NodeRadio-Windows-*.zip
